# ---------------------------------------------------------------------------
# Tier 1 universe: listed fashion, luxury and premium-consumer companies.
#
# WHY THIS IS A CONFIG FILE AND NOT PYTHON
# The whole point of the design (see DESIGN.md section 2.3) is that the
# infrastructure is universe-agnostic: Tier 2 is the STOXX 600 + S&P 500, and
# it must run through exactly the same code path with no edits. A universe is
# therefore data, never a code branch.
#
# WHY THIS LIST IS ONLY A SEED
# Hand-picking companies is precisely the practice the protocol is meant to
# rule out. This file exists so the pilot can run today; the authoritative
# universe is built by `wikidata.discover_listed_companies()`, which selects
# every entity with a stock-exchange listing (P414) in a chosen industry (P452)
# with no human in the loop. When the two disagree, the Wikidata list wins and
# the disagreement is a finding worth reporting.
#
# SURVIVORSHIP BIAS
# Delisted names are kept, with `delisted_on` set. Removing them because their
# series ends early is the textbook way to manufacture a result: the survivors
# are, by construction, the companies whose attention shocks did not kill them.
# The panel is unbalanced on purpose.
#
# NOTHING HERE IS TRUSTED UNTIL THE VALIDATOR RUNS
# These tickers and article titles were written without network access. Run
#   python -m attention_panel.cli validate-universe config/universe_luxury.yaml
# before trusting any of them: it reports every symbol that does not resolve to
# a usable price series on both yfinance and Stooq, and every article title
# that does not exist on en.wikipedia.
#
# WHY THERE ARE NO WIKIDATA QIDs IN THIS FILE
# Writing QIDs by hand is error-prone and silently wrong -- a mistyped QID
# resolves to a real but unrelated entity, which no schema check would catch.
# The QID is instead looked up from the `corporate` article title at load time
# (MediaWiki `prop=pageprops&ppprop=wikibase_item`), so the only identifier a
# human has to get right is one an author can actually read and verify.
# ---------------------------------------------------------------------------

name: luxury_fashion_tier1
description: >
  Listed fashion, luxury and premium-consumer companies used as the
  pre-registered pilot study. Wide enough for a panel, narrow enough that the
  multilingual attention channel has a genuine economic interpretation.

# Languages fetched for every entity. See DESIGN.md section 2.4 for the caveat
# that zh.wikipedia does NOT measure mainland Chinese readership -- Wikipedia
# has been blocked in mainland China since 2019, so zh is a Greater-China-
# ex-mainland proxy and ja/ko are the cleaner Asian demand signals.
languages: [en, it, fr, de, es, ja, ko, zh]

# Sector-wide theme articles. These are NOT attached to any single company:
# they enter the panel as common factors (see DESIGN.md section 3), so that a
# Met Gala spike is absorbed as a sector event rather than being attributed to
# whichever brand happens to be most read that week.
theme_terms:
  - Fashion week
  - Met Gala
  - Quiet luxury
  - Luxury goods
  - Counterfeit consumer goods
  - Fast fashion
  - Haute couture
  - Sneaker collecting

companies:

  # --- Europe: hard luxury and conglomerates -------------------------------
  - ticker: MC.PA
    name: LVMH
    articles:
      corporate: LVMH
      brands: [Louis Vuitton, Moët & Chandon, Bulgari, Tiffany & Co., Fendi, Celine (brand)]
      # REMOVED pending a verified title:
      #   "Loewe (brand)"                  -> redirects to "Löwe", a different entity
      #   "Christian Dior (fashion house)" -> redirects to "Dior", colliding with
      #     the corporate article of Christian Dior SE (see the removed CDI.PA
      #     entry below). A brand article that resolves onto another listed
      #     company's corporate article cannot be told apart from it.
      people: [Bernard Arnault, Delphine Arnault, Pharrell Williams]

  - ticker: RMS.PA
    name: Hermes International
    articles:
      corporate: Hermès
      brands: [Birkin bag, Kelly bag]
      people: [Axel Dumas, Pierre-Alexis Dumas]

  - ticker: KER.PA
    name: Kering
    articles:
      corporate: Kering
      brands: [Gucci, Yves Saint Laurent (brand), Balenciaga, Bottega Veneta, Alexander McQueen (brand)]
      people: [François-Henri Pinault, Demna]

  - ticker: CFR.SW
    name: Compagnie Financiere Richemont
    articles:
      corporate: Richemont
      brands: [Cartier (jeweler), Van Cleef & Arpels, IWC Schaffhausen, Jaeger-LeCoultre, Montblanc (company)]
      people: [Johann Rupert]

  - ticker: UHR.SW
    name: Swatch Group
    articles:
      corporate: The Swatch Group
      brands: [Omega SA, Longines, Tissot, Swatch, Breguet (brand)]
      people: [Nick Hayek Jr.]

  # REMOVED: CDI.PA (Christian Dior SE)
  #
  # Two independent reasons, both found by `validate-universe` on the first
  # live run, and both decided BEFORE any modelling:
  #
  # 1. Article collision. "Christian Dior SE" and "Christian Dior (fashion
  #    house)" both redirect to "Dior" on en.wikipedia, so its corporate series
  #    would have been numerically identical to an LVMH brand series. The
  #    assumption written in the old comment here -- that the holding company
  #    and the fashion house are distinct articles -- was simply false.
  #
  # 2. It is not an independent entity. Christian Dior SE's main asset is a
  #    ~42% stake in LVMH, making it close to a levered LVMH proxy. Two panel
  #    rows tracking one underlying asset inflate the effective sample size
  #    that every clustered standard error is computed from.
  #
  # To restore it, give it a verified corporate article that does not resolve
  # to "Dior", and treat CDI.PA and MC.PA as one cluster rather than two.

  - ticker: 1913.HK
    name: Prada
    articles:
      corporate: Prada
      brands: [Miu Miu]
      people: [Miuccia Prada, Raf Simons]

  - ticker: MONC.MI
    name: Moncler
    articles:
      corporate: Moncler
      brands: [Stone Island]
      people: [Remo Ruffini]

  - ticker: BC.MI
    name: Brunello Cucinelli
    articles:
      corporate: Brunello Cucinelli (company)
      people: [Brunello Cucinelli]

  - ticker: SFER.MI
    name: Salvatore Ferragamo
    articles:
      corporate: Salvatore Ferragamo S.p.A.
      people: [Salvatore Ferragamo]

  - ticker: ZGN
    name: Ermenegildo Zegna
    articles:
      corporate: Ermenegildo Zegna
      brands: [Thom Browne]

  - ticker: TOD.MI
    name: Tod's
    delisted_on: 2024-11-01   # taken private; series ends here, kept on purpose
    articles:
      corporate: Tod's
      brands: [Roger Vivier]

  - ticker: BRBY.L
    name: Burberry
    articles:
      corporate: Burberry
      people: [Daniel Lee (fashion designer)]

  - ticker: PNDORA.CO
    name: Pandora A/S
    articles:
      corporate: Pandora (jewelry)

  - ticker: WOSG.L
    name: Watches of Switzerland
    articles:
      corporate: Watches of Switzerland Group

